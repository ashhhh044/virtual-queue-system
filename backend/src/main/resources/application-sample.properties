# Application Name
spring.application.name=virtual-queue

# Server
server.port=8081

# MySQL Database Configuration
# Replace with your actual credentials
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_queue?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=super-secret-key-at-least-32-characters-long
jwt.expiration=28800

# Security (Disabled for development)
spring.security.basic.enabled=false