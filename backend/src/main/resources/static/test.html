<!doctype html>
<html>
  <head>
    <title>WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  </head>
  <body>
    <h1>WebSocket Test</h1>
    <div id="messages"></div>

    <script>
      var socket = new SockJS("http://localhost:8081/ws");
      var stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);

        // Subscribe to general queue updates
        stompClient.subscribe("/topic/queue/General", function (message) {
          var data = JSON.parse(message.body);
          document.getElementById("messages").innerHTML +=
            "<p>Queue Update: " + data.queueSize + " customers</p>";
          console.log(data);
        });

        // Subscribe to all queue updates
        stompClient.subscribe("/topic/queue/all", function (message) {
          var data = JSON.parse(message.body);
          document.getElementById("messages").innerHTML +=
            "<p>Update: " +
            data.serviceType +
            " - " +
            data.queueSize +
            " customers</p>";
        });
      });

      function sendMessage() {
        stompClient.send("/app/queue/request", {}, "General");
      }
    </script>
  </body>
</html>
