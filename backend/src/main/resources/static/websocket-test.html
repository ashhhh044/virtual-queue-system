<!doctype html>
<html>
  <head>
    <title>WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      #messages {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 5px;
        max-height: 400px;
        overflow-y: auto;
        margin-top: 20px;
      }
      .message {
        padding: 10px;
        margin: 5px 0;
        background: white;
        border-radius: 3px;
        border-left: 3px solid #007bff;
      }
      .status {
        padding: 10px;
        background: #d4edda;
        border-radius: 5px;
        margin-top: 10px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .connected {
        background: #28a745;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
      }
      .disconnected {
        background: #dc3545;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Test</h1>
    <div id="status" class="disconnected">Disconnected</div>
    <br />
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <button onclick="requestQueue()">Request Queue</button>

    <div id="messages">
      <div class="message">Waiting for connection...</div>
    </div>

    <script>
      var stompClient = null;

      function connect() {
        var socket = new SockJS("http://localhost:8081/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
          document.getElementById("status").className = "connected";
          document.getElementById("status").textContent = "Connected: " + frame;
          addMessage("Connected to WebSocket!");

          // Subscribe to all queue updates
          stompClient.subscribe("/topic/queue/all", function (message) {
            var data = JSON.parse(message.body);
            addMessage(
              "QUEUE UPDATE: " +
                data.serviceType +
                " - " +
                data.queueSize +
                " customers",
            );
            console.log("Queue update:", data);
          });

          // Subscribe to specific queue
          stompClient.subscribe("/topic/queue/General", function (message) {
            var data = JSON.parse(message.body);
            addMessage(
              "General Queue: " + data.queueSize + " customers waiting",
            );
            console.log("General queue:", data);
          });

          // Subscribe to customer updates (listen for any)
          stompClient.subscribe("/topic/customer/**", function (message) {
            var data = JSON.parse(message.body);
            addMessage(
              "Customer Update: Token " +
                data.tokenNumber +
                " - " +
                data.status,
            );
            console.log("Customer update:", data);
          });
        });
      }

      function disconnect() {
        if (stompClient !== null) {
          stompClient.disconnect();
          document.getElementById("status").className = "disconnected";
          document.getElementById("status").textContent = "❌ Disconnected";
          addMessage("Disconnected from WebSocket");
        }
      }

      function requestQueue() {
        if (stompClient !== null) {
          stompClient.send("/app/queue/request", {}, "General");
          addMessage("Requested queue data");
        } else {
          addMessage("Please connect first!");
        }
      }

      function addMessage(text) {
        var messages = document.getElementById("messages");
        var div = document.createElement("div");
        div.className = "message";
        div.textContent = new Date().toLocaleTimeString() + " - " + text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
    </script>
  </body>
</html>
